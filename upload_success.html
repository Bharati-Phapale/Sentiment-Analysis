<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Success</title>
    <style>
        /* Reset some default styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body styling */
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            text-align: center;
        }
        header {
            background-color: #34495e;
            color: white;
            width: 100%;
            position: fixed;
            top: 0;
            padding: 15px 20px;
            font-size: 20px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            flex: 1;
            text-align: center;
        }

        .header-buttons {
            position: absolute;
            right: 20px;
        }

        .header-buttons a {
            text-decoration: none;
            color: white;
            background: #e74c3c;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 16px;
            margin-left: 10px;
            transition: 0.3s;
        }

        .header-buttons a:hover {
            background: #c0392b;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .stars {
            font-size: 24px;
            color: gold;
        }

        .upload-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #ff6f61;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .upload-link:hover {
            background-color: yellowgreen;
            color: black;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">Multimodal Sentiment Analysis</div>
        <div class="header-buttons">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'logout' %}">Logout</a>
        </div>
    </header>

    <div class="container">
        <h2>Upload Successful!</h2>

        <p><strong>Predicted Sentiment:</strong> <span style="color: {{ sentiment_color }}">{{ sentiment }}</span></p>

        

        <a href="{% url 'upload_sentiment_data' %}" class="upload-link">Upload Another</a>
    </div>
</body>
</html>
