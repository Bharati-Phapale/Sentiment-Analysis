<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimodal Sentiment Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding-top: 60px;
        }
        
        header {
            background-color: #34495e;
            color: white;
            width: 100%;
            position: fixed;
            top: 0;
            padding: 15px 20px;
            font-size: 20px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            flex: 1;
            text-align: center;
        }

        .header-buttons {
            position: absolute;
            right: 20px;
        }

        .header-buttons a {
            text-decoration: none;
            color: white;
            background: #e74c3c;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 16px;
            margin-left: 10px;
            transition: 0.3s;
        }

        .header-buttons a:hover {
            background: #c0392b;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        
        h2 {
            margin-bottom: 20px;
            color: #2c3e50;
            font-size: 26px;
            font-weight: 600;
        }
        
        .input-fields input, .input-fields textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #ff4757;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .submit-btn:hover {
            background: #2ecc71;
        }
        
        .output-section {
            margin-top: 20px;
        }
        
        .sentiment-output {
            font-size: 22px;
            font-weight: 600;
            padding: 10px;
            border-radius: 5px;
        }
        
        .rating {
            font-size: 28px;
            margin-top: 10px;
            color: gold;
        }
        
        footer {
            background: #34495e;
            color: white;
            text-align: center;
            padding: 15px;
            width: 100%;
            position: fixed;
            bottom: 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">Multimodal Sentiment Analysis</div>
        <div class="header-buttons">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'logout' %}">Logout</a>
        </div>
    </header>
    
    <div class="container">
        <h2>Analyze Sentiment from Text & Image</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="input-fields">
                {{ form.image }}
                {{ form.text }}
                <label for="id_rating">Select Rating (1-5):</label>
                {{ form.rating }}
                <br><br><br>
                <button type="submit" class="submit-btn">Analyze Sentiment</button>
            </div>            
        </form>
    </div>
    
    <footer>&copy; 2025 Sentiment Analyzer. All rights reserved.</footer>
</body>
</html>
