
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Multimodal Sentiment Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #eef2f3;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            justify-content: center;
        }

        /* Navigation Bar */
        header {
            width: 100%;
            background: #34495e;
            padding: 15px 0;
            position: fixed;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            margin: auto;
        }

        .logo h1 {
            color: white;
            font-size: 24px;
        }

        nav ul {
            list-style: none;
            display: flex;
        }

        nav ul li {
            margin-left: 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #ffcc00;
        }

        /* Login Form Section */
        .login-form {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin-top: 80px;
        }

        .login-form h2 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #333;
        }

        .login-form input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .login-form button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff6f61, #ff4500);
            color: white;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
            margin-top: 10px;
        }

        .login-form button:hover {
            background: linear-gradient(135deg, #ff4500, #ff2200);
            transform: scale(1.05);
        }

        

        /* Footer */
        footer {
            background: #34495e;
            color: white;
            text-align: center;
            padding: 20px;
            width: 100%;
            position: fixed;
            bottom: 0;
        }

        .header-buttons {
            position: absolute;
            right: 20px;
        }

        .header-buttons a {
            text-decoration: none;
            color: white;
            background: #e74c3c;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 16px;
            margin-left: 10px;
            transition: 0.3s;
        }

        .header-buttons a:hover {
            background: #c0392b;
        }

        .error-messages {
            background-color: #ffdddd;
            color: #d8000c;
            border: 1px solid #d8000c;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .login-form {
                padding: 30px;
            }
            .login-form h2 {
                font-size: 24px;
            }
            .login-form input {
                font-size: 14px;
            }
            .login-form button {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <h1>Multimodal Sentiment Analysis</h1>
            </div>
            <ul class="header-buttons">
                <li><a href="{% url 'home' %}">Home</a></li>
                <li><a href="{% url 'login' %}">Login</a></li>
                <li><a href="{% url 'register' %}">Register</a></li>
            </ul>
        </nav>
    </header>

    <section class="login-form">
        <h2>Login</h2>
        {% if messages %}
    <div class="error-messages">
        {% for message in messages %}
            <p class="error">{{ message }}</p>
        {% endfor %}
    </div>
{% endif %}

        <form id="loginForm" method="POST" >
            {% csrf_token %}
            <input type="text" name="username" id="username" placeholder="Username" required>
            <input type="password" name="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
            <p id="error-message" class="error"></p>
        </form>
    </section>

    <footer>
        <p>&copy; 2025 Sentiment Analyzer. All rights reserved.</p>
    </footer>

    
</body>
</html>
